<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications | Gwon Ryul Han</title>
  <link rel="stylesheet" href="style.css">

  <!-- BibTeX 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/gh/orcid/bibtexParseJs@master/bibtexParse.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="cv.html">CV</a>
    <a href="publications.html">Publications</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1>Publications</h1>

  <!-- 논문이 들어갈 영역 -->
  <div id="publications-list" class="loading">Loading publications...</div>

  <script>
    async function loadBibTeX() {
      const container = document.getElementById('publications-list');
      try {
        const response = await fetch('publications.bib');
        if (!response.ok) throw new Error('publications.bib 파일을 찾을 수 없습니다.');
        const bibText = await response.text();
        const parsedData = bibtexParse.toJSON(bibText);

        if (!parsedData || parsedData.length === 0) {
          container.innerHTML = '<p>등록된 논문이 없습니다.</p>';
          return;
        }

        // 최신 연도순 정렬
        parsedData.sort((a, b) => {
          const yearA = parseInt(a.entryTags.year || a.entryTags.YEAR || '0');
          const yearB = parseInt(b.entryTags.year || b.entryTags.YEAR || '0');
          return yearB - yearA;
        });

        container.innerHTML = '';

        parsedData.forEach(item => {
          const tags = {};
          Object.keys(item.entryTags).forEach(k => {
            tags[k.toLowerCase()] = item.entryTags[k];
          });

          const title = tags.title ? tags.title.replace(/[\{\}]/g, '') : 'Untitled';
          let authors = tags.author ? tags.author.replace(/[\{\}]/g, '') : '';
          
          // 내 이름 볼드 처리
          authors = authors
            .replace(/Han, Gwon Ryul|Gwon Ryul Han|Gwonryul Han|Han, Gwonryul/g, '<strong>Gwon Ryul Han</strong>')
            .replace(/ and /g, ', ');

          const journal = tags.journal || tags.booktitle || 'Preprint';
          const year = tags.year || '';
          const doi = tags.doi ? `https://doi.org/${tags.doi}` : null;
          const url = tags.url || tags.eprint || doi;

          const card = document.createElement('div');
          card.className = 'pub-card';
          card.innerHTML = `
            <div class="pub-title">${title}</div>
            <div class="pub-authors">${authors}</div>
            <div class="pub-venue">${journal}${year ? `, ${year}` : ''}</div>
            <div class="pub-links">
              ${url ? `<a href="${url}" target="_blank" class="pub-btn">Paper / Link</a>` : ''}
              ${doi ? `<a href="${doi}" target="_blank" class="pub-btn">DOI</a>` : ''}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<p style="color: red;">오류: ${err.message}</p>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadBibTeX);
  </script>
</body>
</html>
