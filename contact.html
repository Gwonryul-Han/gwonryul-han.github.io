  <h1>Contact Me</h1>
  <p>If you'd like to get in touch, feel free to send me an email or fill in the form below:</p>
  <p>
    <strong>Email:</strong> gwonryulhan@gmail.com<br>
    <strong>LinkedIn profile:</strong> <a href="https://linkedin.com" target="_blank">View Profile</a>
  </p>

  <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

  <h3>Send a Message</h3>
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="_replyto" required>
    </div>
    <div class="form-group">
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button type="submit">Send</button>
  </form>
